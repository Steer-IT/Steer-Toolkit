<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steer IT">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Steer IT Security Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free security checks from Steer IT: email breaches, email domain spoofing protection, leaked passwords, website security, DNS records and internet speed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: white brand bar + tool nav → deep-blue hero with Steer ribbon stripes and a scanner dial → dashboard of tool cards, or a tool's results as panels */
:root {
  --bg: #f1f5f8;
  --surface: #ffffff;
  --ink: #12273a;
  --muted: #5d6b78;
  --line: #d7e0e8;
  --steer-cyan: #21b2e6;
  --steer-blue: #0e72a0;
  --hero: #0a3550;
  --hero-2: #0e5578;
  --hero-ink: #ffffff;
  --hero-muted: #b9d6e6;
  --accent: #0e72a0;
  --bad: #d23a26;
  --bad-bg: #fcebe8;
  --warn: #b26a00;
  --warn-bg: #fdf2de;
  --good: #1b8a50;
  --good-bg: #e3f5eb;
  --info: #0e72a0;
  --info-bg: #e2f2fa;
  --track: #e3eaf0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1520; --surface: #13202d; --ink: #e6eef5; --muted: #98a8b7; --line: #243446;
    --hero: #06233a; --hero-2: #0a3a58; --hero-muted: #9ec3d8; --accent: #21b2e6;
    --bad: #ff8b77; --bad-bg: #3a1b18; --warn: #f3b75c; --warn-bg: #352710; --good: #6fd59c; --good-bg: #12301f;
    --info: #6fcbf0; --info-bg: #0f2c3d; --track: #1f2f40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1520; --surface: #13202d; --ink: #e6eef5; --muted: #98a8b7; --line: #243446;
  --hero: #06233a; --hero-2: #0a3a58; --hero-muted: #9ec3d8; --accent: #21b2e6;
  --bad: #ff8b77; --bad-bg: #3a1b18; --warn: #f3b75c; --warn-bg: #352710; --good: #6fd59c; --good-bg: #12301f;
  --info: #6fcbf0; --info-bg: #0f2c3d; --track: #1f2f40; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1040px; margin: 0 auto; }
a { color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--steer-cyan); outline-offset: 2px; }

/* Brand bar (logo keeps its white ground in both themes) */
.brandbar { background: #ffffff; border-bottom: 4px solid var(--steer-cyan); }
.brandbar .inner { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 10px; flex-wrap: wrap; }
.brandbar .logo { display: block; flex: 0 0 auto; }
.brandbar img { height: 54px; width: auto; display: block; }
nav.tools { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
nav.tools::-webkit-scrollbar { display: none; }
nav.tools a { font-size: 13.5px; font-weight: 500; color: #3c4b58; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
nav.tools a:hover { background: #eef7fc; color: #0e72a0; }
nav.tools a[aria-current="page"] { background: #0e72a0; color: #ffffff; }

/* Phone: compact header + bottom tab bar */
nav.tabbar { display: none; }
@media (max-width: 700px) {
  .brandbar .inner { padding-block: 8px; flex-wrap: nowrap; }
  .brandbar img { height: 40px; }
  .brandbar .apptitle { display: block; }
  nav.tools { display: none; }
  nav.tabbar {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -6px 20px -14px rgba(10,53,80,.5);
  }
  nav.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; text-decoration: none; color: var(--muted); font-size: 10px; font-weight: 500; border-radius: 8px; min-width: 0; -webkit-tap-highlight-color: transparent; }
  nav.tabbar a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.tabbar svg { width: 22px; height: 22px; }
  nav.tabbar a[aria-current="page"] { color: var(--accent); }
  nav.tabbar a[aria-current="page"] svg { stroke-width: 2.3; }
  body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .hero .inner { padding-block: 24px 26px; gap: 18px; }
  .hero .dial-wrap { display: flex !important; }
  .hero .dial { max-width: 170px; }
  .lede { font-size: 15px; margin-bottom: 18px; }
  main .inner { padding-block: 22px 18px; gap: 16px; }
  .panel, .verdict { padding: 16px; }
  .tool-card { grid-template-columns: 56px minmax(0, 1fr); padding: 16px; gap: 14px; }
  .tool-card .art { width: 56px; height: 56px; border-radius: 12px; }
  .tool-card .art svg { width: 34px; height: 34px; }
}
.apptitle { display: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #0e72a0; border: 1px solid #b8e2f3; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }

/* Hero */
.hero { position: relative; overflow: hidden; color: var(--hero-ink); background: radial-gradient(120% 140% at 85% 20%, var(--hero-2) 0%, var(--hero) 60%); }
.ribbons { position: absolute; inset: 0; pointer-events: none; }
.ribbons i { position: absolute; right: -10%; height: 46px; width: 70%; border-radius: 0 0 0 120px; transform: skewY(-14deg); }
.ribbons i:nth-child(1) { top: 6%;  background: linear-gradient(90deg, transparent, rgba(41,154,194,.55)); }
.ribbons i:nth-child(2) { top: 26%; background: linear-gradient(90deg, transparent, rgba(14,114,160,.8)); }
.ribbons i:nth-child(3) { top: 46%; background: linear-gradient(90deg, transparent 10%, rgba(33,178,230,.55)); }
.ribbons i:nth-child(4) { top: 66%; background: linear-gradient(90deg, transparent 20%, rgba(33,178,230,.35)); }
.hero .inner { position: relative; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 32px; align-items: center; padding-block: 44px 52px; }
@media (max-width: 780px) { .hero .inner { grid-template-columns: 1fr; padding-block: 32px 36px; } .dial-wrap { display: none; } }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--steer-cyan); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 6vw, 54px); line-height: 1.03; margin: 0 0 14px; text-wrap: balance; letter-spacing: -0.015em; }
h1 .hl { color: var(--steer-cyan); }
.lede { color: var(--hero-muted); max-width: 54ch; margin: 0 0 22px; font-size: 16px; }
form.search { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.field { flex: 1 1 240px; min-width: 0; position: relative; display: flex; }
.field input { flex: 1; min-width: 0; font: inherit; font-family: var(--font-mono); font-size: 15px; padding: 14px 16px; border: 0; border-radius: 9px; background: #ffffff; color: #12273a; }
.field input::placeholder { color: #8a97a3; }
.field .reveal { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 12.5px; font-weight: 600; background: #eef3f7; color: #0e72a0; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.field.has-reveal input { padding-right: 70px; }
button.primary { font: inherit; font-weight: 600; padding: 14px 22px; border-radius: 9px; border: 0; background: var(--steer-cyan); color: #06233a; cursor: pointer; flex: 0 0 auto; }
button.primary:hover { background: #4cc4ee; }
button.primary:disabled { opacity: .65; cursor: progress; }
.hero .fine { font-size: 12.5px; color: var(--hero-muted); margin: 12px 0 0; max-width: 62ch; }
.hero .fine a, .linkish { color: #ffffff; }
.linkish { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-cta a { text-decoration: none; font-weight: 600; padding: 12px 18px; border-radius: 9px; }
.hero-cta a.solid { background: var(--steer-cyan); color: #06233a; }
.hero-cta a.ghost { color: #ffffff; border: 1px solid rgba(255,255,255,.35); }

/* Dial */
.dial-wrap { display: flex; justify-content: center; }
.dial { width: 100%; max-width: 270px; aspect-ratio: 1; }
.dial .sweep { transform-origin: 140px 140px; animation: sweep 4s linear infinite; }
.dial.scanning .sweep { animation-duration: 1.1s; }
@keyframes sweep { to { transform: rotate(360deg); } }
.dial text { font-family: var(--font-display); fill: #ffffff; }
.dial .sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; fill: var(--hero-muted); }

/* Content */
main .inner { padding-block: 30px 24px; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.panel h3 { font-family: var(--font-display); font-size: 19px; margin: 0 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

.verdict { border-radius: 14px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.verdict::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--state, var(--accent)); }
.verdict.bad { --state: var(--bad); } .verdict.good { --state: var(--good); } .verdict.err, .verdict.warn { --state: var(--warn); }
.verdict .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-left: 6px; }
.tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; color: var(--state); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.verdict h2 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 28px); line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.verdict p { margin: 0; max-width: 62ch; color: var(--muted); }
.example-flag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: var(--bg); padding: 2px 8px; border-radius: 4px; }
@media (max-width: 620px) { .verdict { grid-template-columns: 1fr; } }

.gauge { width: 190px; max-width: 100%; }
.gauge text { font-family: var(--font-display); fill: var(--ink); }
.gauge .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; fill: var(--muted); }

.figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.fig b { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; color: var(--fc, var(--ink)); overflow-wrap: anywhere; }
.fig span { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-row .k { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
.bar-row .k b { font-weight: 500; }
.bar-row .k em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.bar-row .t { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar-row .t i { display: block; height: 100%; border-radius: inherit; background: var(--steer-cyan); width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.bar-row.hot .t i { background: var(--bad); }

.ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.entry { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.avatar { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: #ffffff; }
.entry .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.entry .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.entry .name { font-weight: 600; font-size: 16px; }
.entry .dom { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.entry .desc { font-size: 13.5px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.entry .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.entry .yr { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 520px) { .entry { grid-template-columns: 40px minmax(0, 1fr); } .avatar { width: 40px; height: 40px; font-size: 15px; } .entry .yr { grid-column: 2; grid-row: 1; justify-self: end; font-size: 15px; } }
.pill { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: var(--good-bg); }

/* Check list rows */
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.check:first-child { border-top: 0; padding-top: 4px; }
.check .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sbg); color: var(--s); }
.check .ico svg { width: 14px; height: 14px; }
.check.pass { --s: var(--good); --sbg: var(--good-bg); }
.check.warn { --s: var(--warn); --sbg: var(--warn-bg); }
.check.fail { --s: var(--bad); --sbg: var(--bad-bg); }
.check.info { --s: var(--info); --sbg: var(--info-bg); }
.check .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.check .name { font-weight: 600; }
.check .what { font-size: 13.5px; color: var(--muted); margin: 0; }
.check .rec { font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: pre; max-width: 100%; }
.check .state { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--s); padding-top: 4px; white-space: nowrap; }
@media (max-width: 520px) { .check { grid-template-columns: 30px minmax(0, 1fr); } .check .state { grid-column: 2; grid-row: 1; justify-self: end; } }

/* Steps + CTA */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--steer-cyan); color: #06233a; }
.steps li b { font-weight: 600; }
.cta { border-radius: 14px; padding: 22px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; color: #ffffff; background: linear-gradient(110deg, var(--steer-blue), #138dc4 60%, var(--steer-cyan)); }
.cta p { margin: 0; max-width: 54ch; font-size: 15.5px; }
.cta a { font-weight: 600; color: #0a3550; background: #ffffff; padding: 11px 18px; border-radius: 9px; text-decoration: none; white-space: nowrap; }
.loading { display: flex; gap: 12px; align-items: center; color: var(--muted); padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--steer-cyan); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.links a { font-size: 13.5px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--bg); padding: 9px 12px; border-radius: 9px; }

/* Dashboard */
.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 720px) { .tool-grid { grid-template-columns: 1fr; } }
.tool-card { position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: inherit; transition: border-color .2s, transform .2s, box-shadow .2s; overflow: hidden; }
.tool-card:hover { border-color: var(--steer-cyan); transform: translateY(-2px); box-shadow: 0 10px 28px -16px rgba(14,114,160,.45); }
.tool-card .art { width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(140deg, var(--hero-2), var(--hero)); display: grid; place-items: center; }
.tool-card .art svg { width: 44px; height: 44px; }
.tool-card .copy { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tool-card .q { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tool-card h3 { font-family: var(--font-display); font-size: 21px; margin: 0; line-height: 1.15; }
.tool-card p { margin: 0; font-size: 14px; color: var(--muted); }
.tool-card .go { margin-top: 6px; font-weight: 600; font-size: 14px; color: var(--accent); }
.tool-card .chk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 720px) { .why { grid-template-columns: 1fr; } }
.why div { padding: 4px 0; }
.why b { display: block; font-family: var(--font-display); font-size: 34px; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; }
.why span { font-size: 13.5px; color: var(--muted); }

/* Password specifics */
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 10px; }
.meter i { height: 10px; border-radius: 4px; background: var(--track); transition: background .3s; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
.flow div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; }
.flow b { font-size: 13px; }
.flow code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
.flow span { font-size: 12px; color: var(--muted); }
@media (max-width: 720px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.traits { display: flex; flex-wrap: wrap; gap: 8px; }

/* Speed test */
.tool-card.wide { grid-column: 1 / -1; }
.speedgauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 600px) { .speedgauges { grid-template-columns: 1fr; } }
.sg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sg .cap { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); align-self: flex-start; display: flex; align-items: center; gap: 8px; }
.sg .cap i { width: 10px; height: 10px; border-radius: 50%; }
.sg svg { width: 100%; max-width: 320px; height: auto; display: block; }
.sg svg text { font-family: var(--font-display); fill: var(--ink); }
.sg svg .tick { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); }
.sg svg .unit { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; fill: var(--muted); }
.start-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.start-row button.primary { font-size: 17px; padding: 16px 30px; }
.phase { font-family: var(--font-mono); font-size: 12.5px; color: var(--hero-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

/* DNS lookup */
.who-runs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .who-runs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.who-runs div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; overflow: hidden; }
.who-runs div::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--steer-cyan); }
.who-runs span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.who-runs b { font-family: var(--font-display); font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.who-runs em { font-style: normal; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.rtable-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.rtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.rtable th { text-align: left; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rtable td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.rtable tr:first-child td { border-top: 0; }
.rtable td.n { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.rtable td.v { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; word-break: break-word; min-width: 220px; }
.rtable td.ttl { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rtype { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px; color: #ffffff; white-space: nowrap; }
.src { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; font-family: var(--font-body); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .spacer { flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.chipbtn { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chipbtn i { width: 8px; height: 8px; border-radius: 50%; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (max-width: 700px) {
  .rtable-wrap { overflow-x: visible; }
  .rtable thead { display: none; }
  .rtable, .rtable tbody { display: block; }
  .rtable tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
  .rtable tr:first-child { border-top: 0; }
  .rtable td { display: block; padding: 0; border: 0; }
  .rtable td.n { white-space: normal; overflow-wrap: anywhere; font-weight: 500; }
  .rtable td.v { grid-column: 1 / -1; min-width: 0; background: var(--bg); border-radius: 6px; padding: 7px 9px; font-size: 12px; }
  .rtable td[colspan] { grid-column: 1 / -1; }
  .toolbar .spacer { display: none; }
}
.btn2 { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); cursor: pointer; }

footer .inner { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 6px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { .dial .sweep, .spinner { animation-duration: 6s; } .bar-row .t i, .tool-card { transition: none; } }
</style>
</head>

  // mode "risk": high = bad. mode "protect": high = good.
  function gauge(score, mode, caption) {

  // DNS over HTTPS (Google, then Cloudflare)
  async function dns(name, type) {
    const tries = [
      () => fetch(`https://dns.google/resolve?name=${encodeURIComponent(name)}&type=${type}`),

    }

  }
  const TYPE_NUM = { A: 1, CNAME: 5, MX: 15, TXT: 16, AAAA: 28, CAA: 257 };

  const validHost = (h) => /^(?=.{3,253}$)([a-z0-9-]{1,63}\.)+[a-z]{2,63}$/.test(h);

  // ================= Tool: Breach check =================
  const Breach = (() => {
    const API = "https://api.xposedornot.com/v1/breach-analytics?email=";

    const PW_RISK = { plaintext: ["Plain-text passwords", "bad", 3], easytocrack: ["Weak password hashes", "bad", 2.5], hardtocrack: ["Strong password hashes", "warn", 1], unknown: ["Password storage unknown", "", 1] };
    const AV = ["#0e72a0", "#21b2e6", "#2a8fb8", "#0a3550", "#4aa3c9", "#1c5f86"];
    const SAMPLE = { email: "jo.bloggs@example.com", pastes: 1, breaches: [
      { breach: "LinkedIn", domain: "linkedin.com", industry: "Information Technology", xposed_date: "2012", xposed_records: 164611595, password_risk: "easytocrack", verified: "Yes", xposed_data: "Email addresses;Passwords", details: "Professional networking site breach exposing email addresses and SHA1 password hashes." },
      { breach: "Dropbox", domain: "dropbox.com", industry: "Information Technology", xposed_date: "2012", xposed_records: 68648009, password_risk: "hardtocrack", verified: "Yes", xposed_data: "Email addresses;Passwords", details: "Cloud storage breach exposing email addresses and password hashes." },
      { breach: "MyFitnessPal", domain: "myfitnesspal.com", industry: "Health", xposed_date: "2018", xposed_records: 143606147, password_risk: "hardtocrack", verified: "Yes", xposed_data: "Email addresses;IP addresses;Passwords;Usernames", details: "Fitness app breach exposing usernames, IP addresses and password hashes." },
      { breach: "Canva", domain: "canva.com", industry: "Information Technology", xposed_date: "2019", xposed_records: 137272116, password_risk: "hardtocrack", verified: "Yes", xposed_data: "Email addresses;Geographic locations;Names;Passwords;Usernames", details: "Online design tool breach exposing names, usernames, locations and bcrypt password hashes." },
      { breach: "Collection #1", domain: "", industry: "Miscellaneous", xposed_date: "2019", xposed_records: 772904991, password_risk: "plaintext", verified: "No", xposed_data: "Email addresses;Passwords", details: "Credential-stuffing list compiled from earlier breaches and traded on hacking forums." },
      { breach: "Twitter (200M)", domain: "twitter.com", industry: "Social Media", xposed_date: "2021", xposed_records: 211524284, password_risk: "unknown", verified: "Yes", xposed_data: "Email addresses;Names;Social media profiles;Usernames", details: "Scraped profile data linking email addresses to accounts, later sold and then leaked." }
    ]};
    let dial;

    function riskScore(list, pastes) {
      if (!list.length && !pastes) return 0;

      list.forEach(b => { s += (PW_RISK[b.password_risk] || PW_RISK.unknown)[2] * 3; });
      const types = new Set(); list.forEach(b => String(b.xposed_data || "").split(";").forEach(t => t.trim() && types.add(t.trim())));
      types.forEach(t => { if (SENSITIVE.test(t)) s += 4; });
      const latest = Math.max(0, ...list.map(b => parseInt(b.xposed_date, 10) || 0));

      return Math.max(8, Math.min(100, Math.round(s)));
    }
    function timeline(list) {
      const years = list.map(b => parseInt(b.xposed_date, 10)).filter(Boolean);
      const now = new Date().getFullYear(), start = Math.min(...years, now - 9), span = now - start + 1;
      const counts = {}; years.forEach(y => counts[y] = (counts[y] || 0) + 1);

      const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Breaches per year" });

        const t = sv("text", { x: padL - 6, y: y + 3, "text-anchor": "end" }); t.textContent = i; svg.append(t);
      }
      for (let k = 0; k < span; k++) {
        const yr = start + k, c = counts[yr] || 0, x = padL + k * bw;
        if (c) { const h = ih * c / max; svg.append(sv("rect", { x: x + bw * .18, y: padT + ih - h, width: bw * .64, height: h, rx: 3, fill: yr >= now - 3 ? "var(--bad)" : "var(--steer-cyan)" })); }
        if (span <= 12 || k % 2 === 0 || yr === now) { const t = sv("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle" }); t.textContent = "'" + String(yr).slice(2); svg.append(t); }
      }
      return svg;
    }
    function render(email, data, isExample) {
      out.replaceChildren();
      const list = (data.breaches || []).slice().sort((a, b) => String(b.xposed_date).localeCompare(String(a.xposed_date)));

        exposed ? (n ? `${email} appears in ${n} known breach${n === 1 ? "" : "es"}` : `${email} appears in leaked data dumps`) : `Good news: ${email} isn't in any known breach`,

        out.append(figures([[fmt(n), "breaches found", "var(--bad)"], [years.length ? String(Math.min(...years)) : "—", "first exposed"], [String(pwBad), "with weak or plain-text passwords", pwBad ? "var(--bad)" : ""], [compact(list.reduce((s, b) => s + (Number(b.xposed_records) || 0), 0)), "people caught up in these breaches"]]));
        const g2 = el("div", "grid2");
        const p1 = panel("Breaches by year", "Red bars are breaches from the last three years."); p1.classList.add("chart"); p1.append(timeline(list));
        const p2 = panel("What was exposed", "How many breaches leaked each type of data. Red marks sensitive data.");
        const counts = {}; list.forEach(b => String(b.xposed_data || "").split(";").map(x => x.trim()).filter(Boolean).forEach(x => counts[x] = (counts[x] || 0) + 1));
        const bars = el("div", "bars"), fills = [];

          av.style.background = AV[[...name].reduce((s, ch) => s + ch.charCodeAt(0), 0) % AV.length]; av.setAttribute("aria-hidden", "true");
          const body = el("div", "body"), top = el("div", "top"); top.append(el("span", "name", name)); if (b.domain) top.append(el("span", "dom", b.domain)); body.append(top);
          const desc = stripTags(b.details); if (desc) body.append(el("p", "desc", desc.length > 240 ? desc.slice(0, 237) + "…" : desc));
